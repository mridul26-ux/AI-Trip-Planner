<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AI Trip Planner</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            max-width: 450px;
            margin: 0 auto;
            margin-top: 3rem;
        }
        .auth-links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.95rem;
        }
        .auth-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="app">
        <header class="hero" style="margin-bottom: 2rem;">
            <h1>Join Us</h1>
            <p>Create an account to save your personalized itineraries.</p>
        </header>

        <main class="auth-container">
            <section class="glass-form-container">
                <form id="signup-form">
                    <div class="input-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="John Doe" required>
                    </div>

                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                    </div>

                    <button type="submit" id="signup-btn">
                        <span class="btn-text">Create Account</span>
                        <div class="loader" id="signup-loader" style="display: none;"></div>
                    </button>
                    <div id="signup-error" class="error-text" style="display: none;"></div>
                </form>

                <div class="auth-links">
                    Already have an account? <a href="login.html">Sign In</a>
                </div>
            </section>
        </main>
    </div>
    
    <script>
        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Mock authentication
            const btnText = document.querySelector('#signup-btn .btn-text');
            const loader = document.getElementById('signup-loader');
            
            btnText.style.display = 'none';
            loader.style.display = 'block';
            document.getElementById('signup-btn').disabled = true;

            setTimeout(() => {
                // Simulate successful sign up and auto-login
                localStorage.setItem('userAuth', JSON.stringify({ email: email, name: name }));
                window.location.href = 'index.html';
            }, 1000);
        });
    </script>
</body>
</html>
